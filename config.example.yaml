paths:
  config_dir: /etc/daran-proxy-stack
  state_dir: /var/lib/daran-proxy-stack
  log_dir: /var/log/daran-proxy-stack

warp:
  socks_host: 127.0.0.1
  socks_port: 40000
  mode: proxy
  backend: auto
  state_dir: /var/lib/daran-proxy-stack/warp
  log_dir: /var/log/daran-proxy-stack

mtproxy:
  listen_host: 0.0.0.0
  listen_port: 443
  stats_port: 8888
  public_host: null
  secret: null
  ad_tag: null
  run_user: nobody
  workers: 1
  container_name: mtproxy
  image: telegrammessenger/proxy:latest
  use_host_network: true

cascade:
  relay_host: 127.0.0.1
  relay_port: 1080
  upstream_socks_host: 127.0.0.1
  upstream_socks_port: 40000
  mode: forward
  enabled: false
