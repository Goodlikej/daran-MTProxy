<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daran Proxy Stack{% block title %}{% endblock %}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2129;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;
  --green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;
  --font:ui-monospace,"SFMono-Regular","Cascadia Code",monospace
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;display:flex;min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* sidebar */
#sidebar{
  width:200px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto
}
#sidebar .brand{padding:0 16px 20px;font-size:14px;font-weight:700;color:var(--text);
  border-bottom:1px solid var(--border);margin-bottom:8px}
#sidebar .brand span{color:var(--accent)}
#sidebar nav a{
  display:flex;align-items:center;gap:8px;padding:7px 16px;color:var(--muted);
  transition:background .15s,color .15s;border-left:2px solid transparent
}
#sidebar nav a:hover{background:var(--bg3);color:var(--text);text-decoration:none}
#sidebar nav a.active{background:var(--bg3);color:var(--accent);border-left-color:var(--accent)}
#sidebar nav a .ico{font-size:15px;width:20px;text-align:center}
#sidebar .status-dot{
  width:7px;height:7px;border-radius:50%;background:var(--muted);margin-left:auto;flex-shrink:0
}
#sidebar .status-dot.ok{background:var(--green)}
#sidebar .status-dot.err{background:var(--red)}
#sidebar footer{margin-top:auto;padding:12px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}

/* main */
#main{flex:1;padding:24px;overflow-y:auto;max-width:1200px}
h1{font-size:18px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--muted);margin-bottom:20px;font-size:12px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px}
.card h2{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card .val{font-size:22px;font-weight:700;color:var(--text)}
.card .val.ok{color:var(--green)}
.card .val.err{color:var(--red)}
.card .val.warn{color:var(--yellow)}
.card p{color:var(--muted);font-size:11px;margin-top:4px}

/* kv table */
.kv{width:100%;border-collapse:collapse}
.kv tr{border-bottom:1px solid var(--border)}
.kv tr:last-child{border-bottom:none}
.kv td{padding:6px 0;vertical-align:top}
.kv td:first-child{color:var(--muted);width:40%;padding-right:12px}
.kv td:last-child{color:var(--text);word-break:break-all}

/* badges */
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:#0f3d1a;color:var(--green);border:1px solid #238636}
.badge.err{background:#3d0f0f;color:var(--red);border:1px solid #da3633}
.badge.warn{background:#3d2f00;color:var(--yellow);border:1px solid #9e6a03}
.badge.info{background:#0d2540;color:var(--accent);border:1px solid #1f6feb}
.badge.muted{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}

/* section */
.section{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:16px}
.section h2{font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* poll status bar */
#poll-bar{
  position:fixed;bottom:0;right:0;padding:4px 10px;font-size:11px;color:var(--muted);
  background:var(--bg2);border-top:1px solid var(--border);border-left:1px solid var(--border)
}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:6px 10px;background:var(--bg3);color:var(--muted);border-bottom:1px solid var(--border)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3)}

/* code block */
pre.code{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:10px;
  overflow-x:auto;font-size:12px;color:#79c0ff;line-height:1.5}

/* progress bar */
.bar-wrap{background:var(--bg3);border-radius:3px;height:6px;margin-top:6px}
.bar-fill{height:6px;border-radius:3px;background:var(--accent);transition:width .4s}
.bar-fill.warn{background:var(--yellow)}
.bar-fill.err{background:var(--red)}

/* action buttons */
.btn{
  background:var(--bg3);color:var(--text);border:1px solid var(--border);
  border-radius:4px;padding:5px 14px;font-family:var(--font);font-size:12px;
  cursor:pointer;transition:background .15s,border-color .15s
}
.btn:hover{background:var(--bg2);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.btn-sm{padding:2px 8px;font-size:11px}
</style>
</head>
<body>
<div id="sidebar">
  <div class="brand">daran<span>-net</span></div>
  <nav>
    <a href="/overview" class="{{ 'active' if active=='overview' else '' }}">
      <span class="ico">◈</span> Overview
    </a>
    <a href="/servers" class="{{ 'active' if active=='servers' else '' }}">
      <span class="ico">⬡</span> Servers
      <span class="status-dot" id="dot-servers"></span>
    </a>
    <a href="/mtproxy" class="{{ 'active' if active=='mtproxy' else '' }}">
      <span class="ico">✈</span> MTProxy
      <span class="status-dot" id="dot-mtproxy"></span>
    </a>
    <a href="/warp" class="{{ 'active' if active=='warp' else '' }}">
      <span class="ico">⟳</span> WARP
      <span class="status-dot" id="dot-warp"></span>
    </a>
    <a href="/cascade" class="{{ 'active' if active=='cascade' else '' }}">
      <span class="ico">⟝</span> Cascade
      <span class="status-dot" id="dot-cascade"></span>
    </a>
    <a href="/amneziawg" class="{{ 'active' if active=='amneziawg' else '' }}">
      <span class="ico">⬡</span> AmneziaWG
      <span class="status-dot" id="dot-awg"></span>
    </a>
    <a href="/jobs" class="{{ 'active' if active=='jobs' else '' }}">
      <span class="ico">⚙</span> Jobs
    </a>
    <a href="/inventory" class="{{ 'active' if active=='inventory' else '' }}">
      <span class="ico">▤</span> Inventory
    </a>
  </nav>
  <footer>
    {% if user %}<a href="/logout" style="color:var(--muted);font-size:11px">⏻ выйти</a><br>{% endif %}
    v0.1.0 · panel
  </footer>
</div>

<div id="main">
{% block content %}{% endblock %}
</div>

<div id="poll-bar">polling…</div>

<script>
const $ = id => document.getElementById(id);
const fmt = v => v == null ? '—' : v;

function setDot(id, ok) {
  const el = $(id);
  if (!el) return;
  el.className = 'status-dot ' + (ok ? 'ok' : 'err');
}

function badge(val, okVal) {
  const ok = val === okVal || val === true;
  return `<span class="badge ${ok?'ok':'err'}">${fmt(val)}</span>`;
}

function badgeText(text, cls) {
  return `<span class="badge ${cls}">${text}</span>`;
}

async function poll() {
  try {
    const r = await fetch('/api/v1/status');
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    window._lastStatus = d;

    // sidebar dots
    setDot('dot-servers', d.server?.ip != null);
    setDot('dot-mtproxy', d.mtproxy?.ok);
    setDot('dot-warp', d.warp?.ok);

    // page-specific update
    if (typeof window.onStatusUpdate === 'function') {
      window.onStatusUpdate(d);
    }

    $('poll-bar').textContent = '↻ updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    $('poll-bar').textContent = '✗ poll error: ' + e.message;
  }
}

poll();
setInterval(poll, 5000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
