<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Daran Proxy Stack</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2129;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;
  --green:#3fb950;--red:#f85149;
  --font:ui-monospace,"SFMono-Regular","Cascadia Code",monospace
}
body{background:var(--bg);color:var(--text);font-family:var(--font);
  display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:32px 36px;width:340px}
.brand{font-size:16px;font-weight:700;margin-bottom:24px;text-align:center}
.brand span{color:var(--accent)}
label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;margin-top:16px}
input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:8px 10px;color:var(--text);font-family:var(--font);font-size:13px;outline:none}
input:focus{border-color:var(--accent)}
.btn{width:100%;margin-top:24px;background:var(--accent);color:#0d1117;
  border:none;border-radius:4px;padding:9px;font-family:var(--font);font-size:13px;
  font-weight:700;cursor:pointer}
.btn:hover{opacity:.9}
.error{background:#3d0f0f;border:1px solid #da3633;border-radius:4px;
  padding:8px 12px;font-size:12px;color:var(--red);margin-bottom:4px}
.hint{text-align:center;margin-top:16px;font-size:11px;color:var(--muted)}
.hint a{color:var(--accent)}
</style>
</head>
<body>
<div class="box">
  <div class="brand">daran<span>-net</span> &nbsp;панель</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">

    <label>Имя пользователя</label>
    <input type="text" name="username" autocomplete="username" autofocus required>

    <label>Пароль</label>
    <input type="password" name="password" autocomplete="current-password" required>

    <button class="btn" type="submit">Войти</button>
  </form>

  <div class="hint"><a href="/setup">Изменить пароль</a></div>
</div>
</body>
</html>
